# Publishes the game (the static files in src/) to GitHub Pages after the tests pass.
#
# Off until you opt in, so it doesn't fail while Pages isn't set up:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#      (Pages from a private repository needs a paid plan; the site itself is public)
#   2. Settings > Secrets and variables > Actions > Variables: add DEPLOY_PAGES = true
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
