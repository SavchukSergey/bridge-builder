<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Builder Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="game-container">

    <canvas id="game-canvas"></canvas>
  </div>

  <div id="control-panel">
    <select id="level-select" title="Level"></select>

    <label>
      <input type="checkbox" id="toggle-simulation" />
      Simulation
    </label>

    <button type="button" id="reset-simulation" disabled>Reset</button>

    <div id="simulation-time">Time: <span id="simulation-time-value">0.00s</span></div>
    <div id="mode-label"></div>

    <span class="separator"></span>

    <button type="button" id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button type="button" id="redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    <label title="Snap new joints to a 1 m grid (hold Alt to place freely)">
      <input type="checkbox" id="toggle-snap" checked />
      Snap
    </label>

    <span class="separator"></span>

    <button type="button" id="new-structure" title="Start this level over (Undo to go back)">Restart</button>
    <button type="button" id="export-structure" title="Download the structure as JSON">Export</button>
    <button type="button" id="import-structure" title="Load a structure from a JSON file">Import</button>
    <input type="file" id="import-file" accept=".json,application/json" hidden />

    <div id="status-message" role="status"></div>
  </div>

  <div id="material-panel">
    <label class="material-option" title="Deck the vehicle drives on">
      <input type="radio" name="material" value="road" />
      <span>Road</span> <small>$300/m</small>
    </label>
    <label class="material-option" title="20 x 20 cm section">
      <input type="radio" name="material" value="steel" checked />
      <span>Steel</span> <small>$200/m</small>
    </label>
    <label class="material-option" title="10 x 10 cm section: a quarter of the strength">
      <input type="radio" name="material" value="steel-light" />
      <span>Light steel</span> <small>$70/m</small>
    </label>
    <label class="material-option" title="Only holds in tension">
      <input type="radio" name="material" value="cable" />
      <span>Cable</span> <small>$60/m</small>
    </label>
    <label class="material-option" title="Only holds in tension; a fifth of the strength">
      <input type="radio" name="material" value="cable-thin" />
      <span>Thin cable</span> <small>$20/m</small>
    </label>

    <div id="cost">Cost: <span id="cost-value"></span><br />Budget: <span id="budget-value"></span></div>
    <div id="load">Load: <span id="load-value"></span></div>

    <div id="level-description"></div>

    <div id="help">
      <p>Get every truck to the flag, within budget. Start the simulation to test.</p>
      <p>Click a joint, then click to place a link.</p>
      <p>Right-click: delete / cancel</p>
      <p>Esc: cancel</p>
      <p>Alt: place without snapping</p>
      <p>Drag: pan &middot; Ctrl+wheel: zoom</p>
    </div>
  </div>

  <div id="link-tooltip" role="tooltip" hidden>
    <div id="link-tooltip-title"></div>
    <div id="link-tooltip-force"></div>
    <div class="meter"><div id="link-tooltip-meter"></div><div id="link-tooltip-peak"></div></div>
    <div id="link-tooltip-load"></div>
  </div>

  <script type="module" src="js/main.js" crossorigin="anonymous"></script>
</body>

</html>
