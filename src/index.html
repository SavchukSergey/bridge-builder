<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Builder Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="game-container">

    <canvas id="game-canvas"></canvas>
  </div>

  <div id="control-panel">
    <label>
      <input type="checkbox" id="toggle-simluation" />
      Simulation
    </label>

    <div id="simuluation-time">Time: <span id="simulation-time-value">0.00s</span></div>
  </div>

  <div id="material-panel">
    <label class="material-option">
      <input type="radio" name="material" value="steel" checked />
      <span>Steel</span>
    </label>
    <label class="material-option">
      <input type="radio" name="material" value="cable" />
      <span>Cable</span>
    </label>
  </div>

  <script type="module" src="js/main.js" crossorigin="anonymous"></script>
</body>

</html>
